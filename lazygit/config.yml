git:
  commit:
    signOff: true

customCommands:
  - key: "C"
    command: "git diff --staged | opencode run --model github-copilot/gpt-5.4-mini 'Generate a concise git commit message for these staged changes. Output ONLY the raw commit message with no markdown, no code blocks, no backticks, no explanations. Use conventional commit format.' > /tmp/commit_msg && git commit -e -F /tmp/commit_msg"
    description: "Generate commit message with Opencode"
    context: "files"
    output: "terminal"
