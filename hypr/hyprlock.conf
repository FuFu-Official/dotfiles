source = colors.conf

$font_family = JetBrains Mono Nerd Font
$font_family_clock = JetBrains Mono Nerd Font
$font_material_symbols = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3

    font_color = $on_surface
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $primary $primary_fixed_dim 45deg
    check_color = $primary_container $tertiary_container 120deg
    fail_color = $error_container $error_container 40deg

    fade_on_empty = true
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $on_surface
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $error
    font_size = 13
    font_family = $font_family
    position = 0, -25
    halign = center
    valign = center
}


label { # Clock
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 95
    font_family = $font_family_clock

    position = 0, 320
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $on_surface_variant
    font_size = 25
    font_family = $font_family_clock

    position = 0, 215
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $on_surface
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $on_surface
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}
